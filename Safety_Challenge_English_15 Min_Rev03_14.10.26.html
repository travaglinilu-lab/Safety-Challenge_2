<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1422;color:#eef4ff;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:#17243a;border:1px solid #30435f;border-radius:16px;padding:20px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:15px}.muted{color:#b5c4d9}.btn{background:#3478ed;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.alt{background:#40516b}.badge{background:#263955;border-radius:20px;padding:9px 13px;font-weight:bold}.timer{font-size:23px;color:#ffd166}.bar{height:8px;background:#263955;border-radius:8px;margin:15px 0;overflow:hidden}.bar div{height:100%;width:0;background:#5aa2ff}input{width:100%;padding:12px;border:1px solid #536782;background:#0e192a;color:white;border-radius:9px;font-size:17px}.clue,.feedback{background:#243550;border-radius:9px;padding:11px;margin:8px 0;line-height:1.45}.word{font-size:26px;letter-spacing:4px;text-align:center;margin:22px 0;overflow-wrap:anywhere}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{background:#293d5b;color:white;border:2px solid transparent;border-radius:9px;padding:13px;text-align:left;cursor:pointer}.option.correct{background:#17663c}.option.wrong{background:#8c2932}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.crosswrap{overflow:auto}.cross{display:grid;grid-template-columns:repeat(16,23px);grid-auto-rows:23px;gap:2px;justify-content:center;min-width:max-content;margin:14px auto}.cell{width:23px;height:23px;background:#f4f7fb;color:#111827;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border-radius:2px}.blank{background:transparent!important}.found{background:#80e0ad}.hidden{display:none}.result{text-align:center}.big{font-size:56px;font-weight:bold;color:#78b4ff}.level{font-size:25px;font-weight:bold;margin:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.wrap{padding:9px}.cross{grid-template-columns:repeat(16,20px);grid-auto-rows:20px}.cell{width:20px;height:20px;font-size:10px}}
</style></head><body><div class="wrap"><div id="app"></div></div><script>
const TXT={en:{title:'SAFETY CHALLENGE',sub:'High-Risk & Petrochemical Safety · D.Lgs. 81/08',start:'START CHALLENGE',name:'Player name (optional)',rules:'15 minutes · 3 games · max 3 attempts per question · maximum 100 points',score:'Score',g1:'GAME 1 — SAFETY HANGMAN',cross:'LIVE CROSSWORD',crosshelp:'Each discovered word is added here. The crossword stays visible throughout Game 1.',answer:'Type the safety word…',check:'CHECK ANSWER',next:'NEXT',attempt:'Attempt',wrong:'Not correct. Try again.',correct:'Correct!',three:'Three attempts used.',reveal:'Correct answer',g2:'GAME 2 — SPIN THE SAFETY WHEEL',spin:'SPIN THE WHEEL',choose:'Choose the correct answer:',g3:'GAME 3 — SAFETY DETECTIVE',intro:'Read the clues and identify the safety concept. Fewer clues mean more points.',revealclue:'REVEAL NEXT CLUE',done:'CHALLENGE COMPLETE',final:'FINAL SCORE',send:'Tell your trainer:',play:'PLAY AGAIN',clue:'Clue',points:'points',wheelintro:'Spin to reveal a safety category and its question.',levels:['SAFETY RESTART','SAFETY BASIC','SAFETY INTERMEDIATE','SAFETY ADVANCED','SAFETY EXPERT'],desc:['Review core safety principles and site rules.','Your basic safety knowledge needs improvement.','You have a foundation, but key high-risk concepts need review.','Very good preparation across major safety topics.','Excellent result across the safety topics in this challenge.'],time:'Time used',timeout:'Time is up.',copy:'COPY RESULT'},it:{title:'SFIDA SICUREZZA',sub:'Sicurezza alto rischio e petrolchimico · D.Lgs. 81/08',start:'INIZIA LA SFIDA',name:'Nome partecipante (facoltativo)',rules:'15 minuti · 3 giochi · max 3 tentativi per domanda · massimo 100 punti',score:'Punteggio',g1:'GIOCO 1 — SCOPRI LA PAROLA',cross:'CRUCIVERBA IN TEMPO REALE',crosshelp:'Ogni parola scoperta viene aggiunta qui. Il cruciverba resta visibile per tutto il primo gioco.',answer:'Scrivi la parola di sicurezza…',check:'VERIFICA RISPOSTA',next:'AVANTI',attempt:'Tentativo',wrong:'Risposta errata. Riprova.',correct:'Corretto!',three:'Hai utilizzato tutti e tre i tentativi.',reveal:'Risposta corretta',g2:'GIOCO 2 — GIRA LA RUOTA',spin:'GIRA LA RUOTA',choose:'Scegli la risposta corretta:',g3:'GIOCO 3 — INVESTIGATORE DELLA SICUREZZA',intro:'Leggi gli indizi e individua il concetto. Meno indizi usi, più punti ottieni.',revealclue:'MOSTRA IL PROSSIMO INDIZIO',done:'SFIDA COMPLETATA',final:'PUNTEGGIO FINALE',send:'Comunica al docente:',play:'GIOCA ANCORA',clue:'Indizio',points:'punti',wheelintro:'Gira la ruota per scoprire una categoria di sicurezza e la relativa domanda.',levels:['DA RIPASSARE','BASE','INTERMEDIO','AVANZATO','ESPERTO'],desc:['Ripassa i principi fondamentali e le procedure del sito.','Le conoscenze di base sulla sicurezza vanno rafforzate.','Hai una base, ma alcuni concetti ad alto rischio vanno ripassati.','Ottima preparazione sui principali temi della sicurezza.','Risultato eccellente sugli argomenti della sfida.'],time:'Tempo impiegato',timeout:'Tempo scaduto.',copy:'COPIA RISULTATO'}};
const BANK={en:{hang:[['PPE',['I protect workers from specific hazards.','Examples include helmets, gloves and safety shoes.','I must be selected according to the risk.']],['RISK ASSESSMENT',['I am a fundamental safety activity.','I identify and evaluate workplace risks.','I lead to preventive and protective measures.']],['PERMIT TO WORK',['I control certain hazardous activities.','I may be required for hot work.','I define precautions and authorisation before work starts.']],['CONFINED SPACE',['I am not designed for continuous occupancy.','Access or escape may be difficult.','Hazardous atmospheres may be present.']],['LOCKOUT TAGOUT',['I am used before maintenance.','I prevent unexpected start-up or energy release.','My short name is LOTO.']]],wheel:[['D.Lgs. 81/08','Who has the primary responsibility for carrying out the risk assessment?',['The worker','The employer','The RLS','The safety officer'],1],['High-risk work','Before high-risk maintenance, what is essential?',['Start immediately','Check only experience','Identify hazards and implement controls','Remove warning signs'],2],['Petrochemical','What is the main purpose of a Permit to Work?',['Record working hours','Control and authorise specific hazardous work','Replace PPE','Replace the risk assessment'],1],['Fire & explosion','What are the three elements of the fire triangle?',['Fuel, oxygen, ignition source','Water, fuel, smoke','Oxygen, water, pressure','Gas, water, heat'],0],['H₂S','Which statement about hydrogen sulphide (H₂S) is correct?',['It is harmless at low concentrations','It is highly toxic and can impair the sense of smell','It is always visible','It replaces the need for gas testing'],1]],detect:[['FLAMMABLE GAS',['I can cause fire or explosion.','I may be present in process equipment.','I can form an explosive atmosphere.','Gas detectors can help identify me.']],['HYDROGEN SULPHIDE',['I may be invisible.','I am highly toxic.','I am relevant in some oil & gas operations.','My chemical formula is H₂S.']],['HOT WORK',['I can create an ignition source.','Welding and cutting are examples.','A permit and fire precautions may be required.','I need appropriate controls in hazardous areas.']],['LOTO',['I am used during maintenance.','I prevent unexpected start-up.','I require hazardous energy isolation.','My acronym means Lockout/Tagout.']],['CONFINED SPACE',['Access may be difficult.','Hazardous gases or low oxygen may be present.','Atmospheric testing and an entry procedure may be required.','I am not designed for continuous occupancy.']]]},it:{hang:[['DPI',['Proteggo i lavoratori da rischi specifici.','Esempi sono casco, guanti e calzature di sicurezza.','Devo essere scelto in funzione del rischio.']],['VALUTAZIONE RISCHI',["Sono un'attività fondamentale della sicurezza.",'Individuo e valuto i rischi presenti sul lavoro.','Porto all’adozione di misure preventive e protettive.']],['PERMESSO LAVORO',['Controllo determinate attività pericolose.','Posso essere richiesto per i lavori a caldo.','Definisco precauzioni e autorizzazioni prima dell’inizio.']],['SPAZIO CONFINATO',['Non sono progettato per la permanenza continua.','Accesso o uscita possono essere difficili.','Possono essere presenti atmosfere pericolose.']],['LOCKOUT TAGOUT',['Sono usato prima della manutenzione.','Prevengo avviamenti o rilasci di energia inattesi.','Il mio acronimo è LOTO.']]],wheel:[['D.Lgs. 81/08','Chi ha la responsabilità primaria di effettuare la valutazione dei rischi?',['Il lavoratore','Il datore di lavoro',"L'RLS",'Il responsabile della sicurezza'],1],['Lavori ad alto rischio','Prima di una manutenzione ad alto rischio, cosa è essenziale?',['Iniziare subito','Verificare solo l’esperienza','Identificare i pericoli e attuare i controlli','Rimuovere i cartelli'],2],['Petrolchimico','Qual è lo scopo principale del Permit to Work?',['Registrare le ore','Controllare e autorizzare specifiche attività pericolose','Sostituire i DPI','Sostituire la valutazione dei rischi'],1],['Incendio ed esplosione','Quali sono i tre elementi del triangolo del fuoco?',['Combustibile, ossigeno, sorgente d’innesco','Acqua, combustibile, fumo','Ossigeno, acqua, pressione','Gas, acqua, calore'],0],['H₂S',"Quale affermazione sull'idrogeno solforato (H₂S) è corretta?",['È innocuo a basse concentrazioni','È altamente tossico e può compromettere l’olfatto','È sempre visibile','Rende inutile il controllo dei gas'],1]],detect:[['GAS INFIAMMABILE',['Può causare incendio o esplosione.','Può essere presente nelle apparecchiature di processo.','Può formare un’atmosfera esplosiva.','I rilevatori possono aiutare a identificarlo.']],['IDROGENO SOLFORATO',['Può essere invisibile.','È altamente tossico.','È rilevante in alcune attività Oil & Gas.','La formula chimica è H₂S.']],['LAVORO A CALDO',['Può creare una sorgente di innesco.','Saldatura e taglio ne sono esempi.','Possono servire permesso e precauzioni antincendio.','Richiede controlli adeguati nelle aree pericolose.']],['LOTO',['È usato durante la manutenzione.','Previene avviamenti inattesi.','Richiede l’isolamento delle energie pericolose.','Significa Lockout/Tagout.']],['SPAZIO CONFINATO',['L’accesso può essere difficile.','Possono esserci gas pericolosi o carenza di ossigeno.','Possono servire test atmosferici e procedura di ingresso.','Non è progettato per la permanenza continua.']]]}};
let lang='en',t=TXT.en,b=BANK.en,score=0,player='',timer=900,tick=null,phase=0,pos=0,tries=0,clueCount=1,wheelOrder=[],wheelPos=0;const $=id=>document.getElementById(id);function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/gi,'').toUpperCase()}
function home(){clearInterval(tick);t=TXT[lang];b=BANK[lang];$('app').innerHTML=`<div class="panel" style="max-width:750px;margin:55px auto;text-align:center"><h1>🦺 ${t.title}</h1><p class="muted">${t.sub}</p><input id="player" placeholder="${t.name}" style="margin:15px 0"><div class="actions" style="justify-content:center"><button class="btn" onclick="start()">${t.start}</button><button class="btn alt" onclick="switchLang()">EN / IT</button></div><p class="muted">${t.rules}</p></div>`}function switchLang(){lang=lang==='en'?'it':'en';home()}
function start(){player=$('player').value.trim();score=0;timer=900;phase=0;pos=0;tries=0;wheelOrder=[0,1,2,3,4].sort(()=>Math.random()-.5);wheelPos=0;layout();tick=setInterval(()=>{timer--;if(timer<=0){timer=0;finish(true)}clock()},1000);showHang()}function layout(){$('app').innerHTML=`<div class="row"><div><h1>🦺 ${t.title}</h1><div class="muted">${t.sub}</div></div><div class="row"><span class="badge">${t.score}: <b id="sc">0</b>/100</span><span id="tm" class="badge timer">15:00</span></div></div><div class="bar"><div id="prog"></div></div><div id="content"></div>`}function update(){if($('sc'))$('sc').textContent=score;if($('prog'))$('prog').style.width=(phase/3*100)+'%'}function clock(){if($('tm'))$('tm').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}
function showHang(){tries=0;let x=b.hang[pos];$('content').innerHTML=`<div class="grid"><section class="panel"><h2>🎯 ${t.g1}</h2><p>${lang==='en'?'Discover the hidden safety term. Maximum 3 attempts.':'Scopri il termine di sicurezza. Massimo 3 tentativi.'}</p><div class="word">${x[0].split('').map(c=>c===' '?'　':'_').join(' ')}</div>${x[1].map((c,i)=>`<div class="clue"><b>${t.clue} ${i+1}:</b> ${c}</div>`).join('')}<input id="ans" placeholder="${t.answer}" autocomplete="off"><div class="actions"><button class="btn" onclick="checkHang()">${t.check}</button></div><div id="fb"></div></section><aside class="panel"><h2>🧩 ${t.cross}</h2><p class="muted">${t.crosshelp}</p><div id="cross" class="crosswrap"></div><p class="muted">${lang==='en'?'Words discovered':'Parole scoperte'}: ${pos}/5</p></aside></div>`;drawCross(pos);update()}function drawCross(n){let words=b.hang.slice(0,n).map(x=>x[0].replace(/ /g,''));let html='<div class="cross">';if(!words.length)html+='<div class="muted" style="grid-column:span 16;padding:12px">—</div>';words.forEach(w=>{for(let c=0;c<16;c++){let ch=w[c]||'';html+=ch?`<div class="cell found">${ch}</div>`:'<div class="cell blank"></div>'}});$('cross').innerHTML=html+'</div>'}function checkHang(){if(tries>=3)return;tries++;let x=b.hang[pos];if(norm($('ans').value)===norm(x[0])){score+=6;drawCross(pos+1);$('fb').innerHTML=`<div class="feedback">✅ ${t.correct} +6 ${t.points}<br><b>${x[0]}</b></div><div class="actions"><button class="btn" onclick="nextHang()">${t.next}</button></div>`}else if(tries===3){$('fb').innerHTML=`<div class="feedback">❌ ${t.three}<br>${t.reveal}: <b>${x[0]}</b></div><div class="actions"><button class="btn" onclick="nextHang()">${t.next}</button></div>`}else $('fb').innerHTML=`<div class="feedback">❌ ${t.wrong} (${t.attempt} ${tries}/3)</div>`;update()}function nextHang(){pos++;if(pos>=b.hang.length){phase=1;pos=0;showWheel()}else showHang();update()}
function showWheel(){tries=0;let x=b.wheel[wheelOrder[wheelPos]];$('content').innerHTML=`<section class="panel"><h2>🎡 ${t.g2}</h2><p>${t.wheelintro}</p><div class="row"><span class="badge">${x[0]}</span><button id="spin" class="btn" onclick="spin()">${t.spin}</button></div><div id="qbox" class="hidden"><h3>${x[1]}</h3><p>${t.choose}</p><div class="options">${x[2].map((o,i)=>`<button class="option" onclick="answerWheel(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="fb"></div></div></section>`;update()}function spin(){let s=$('spin');s.disabled=true;s.textContent='🎡 ...';setTimeout(()=>{$('qbox').classList.remove('hidden');s.textContent='✓'},600)}function answerWheel(i,el){if(tries>=3)return;tries++;let x=b.wheel[wheelOrder[wheelPos]];if(i===x[3]){score+=x[4]||7;document.querySelectorAll('.option').forEach((e,j)=>{e.disabled=true;if(j===x[3])e.classList.add('correct')});$('fb').innerHTML=`<div class="feedback">✅ ${t.correct} +7 ${t.points}</div><div class="actions"><button class="btn" onclick="nextWheel()">${t.next}</button></div>`}else{el.classList.add('wrong');if(tries===3){document.querySelectorAll('.option').forEach((e,j)=>{e.disabled=true;if(j===x[3])e.classList.add('correct')});$('fb').innerHTML=`<div class="feedback">❌ ${t.three}<br>${t.reveal}: <b>${String.fromCharCode(65+x[3])}. ${x[2][x[3]]}</b></div><div class="actions"><button class="btn" onclick="nextWheel()">${t.next}</button></div>`}else $('fb').innerHTML=`<div class="feedback">❌ ${t.wrong} (${t.attempt} ${tries}/3)</div>`}update()}function nextWheel(){wheelPos++;if(wheelPos>=b.wheel.length){phase=2;pos=0;showDetect()}else showWheel();update()}
function showDetect(){tries=0;clueCount=1;let x=b.detect[pos];$('content').innerHTML=`<section class="panel"><h2>🔎 ${t.g3}</h2><p>${t.intro}</p><div id="clues"></div><input id="ans" placeholder="${t.answer}" autocomplete="off"><div class="actions"><button class="btn alt" onclick="revealClue()">${t.revealclue}</button><button class="btn" onclick="checkDetect()">${t.check}</button></div><div id="fb"></div></section>`;renderClues();update()}function renderClues(){$('clues').innerHTML=b.detect[pos][1].slice(0,clueCount).map((c,i)=>`<div class="clue"><b>${t.clue} ${i+1}:</b> ${c}</div>`).join('')}function revealClue(){if(clueCount<4){clueCount++;renderClues()}}function checkDetect(){if(tries>=3)return;tries++;let x=b.detect[pos];if(norm($('ans').value)===norm(x[0])){let p=[7,6,5,4][clueCount-1];score+=p;$('fb').innerHTML=`<div class="feedback">✅ ${t.correct} +${p} ${t.points}<br><b>${x[0]}</b></div><div class="actions"><button class="btn" onclick="nextDetect()">${t.next}</button></div>`}else if(tries===3){$('fb').innerHTML=`<div class="feedback">❌ ${t.three}<br>${t.reveal}: <b>${x[0]}</b></div><div class="actions"><button class="btn" onclick="nextDetect()">${t.next}</button></div>`}else $('fb').innerHTML=`<div class="feedback">❌ ${t.wrong} (${t.attempt} ${tries}/3)</div>`;update()}function nextDetect(){pos++;if(pos>=b.detect.length)finish(false);else showDetect()}
function finish(timeout){clearInterval(tick);let ix=score>=85?4:score>=70?3:score>=55?2:score>=40?1:0;let used=900-timer,tm=String(Math.floor(used/60)).padStart(2,'0')+':'+String(used%60).padStart(2,'0');$('app').innerHTML=`<section class="panel result"><h1>🏁 ${t.done}</h1>${timeout?`<p>${t.timeout}</p>`:''}<div class="big">${score}/100</div><div class="level">${t.levels[ix]}</div><p>${t.desc[ix]}</p><div class="feedback"><b>${t.send}</b><br><br><span id="resultText">${player||'Player'} — ${score}/100 — ${t.levels[ix]}</span><br>${t.time}: ${tm}</div><div class="actions" style="justify-content:center"><button class="btn" onclick="home()">${t.play}</button><button class="btn alt" onclick="copyResult()">${t.copy}</button></div></section>`}function copyResult(){let txt=$('resultText').textContent;if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});}
home();
</script></body></html>
